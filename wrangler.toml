name = "azure-inventory-web"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./out"

# ------------------------------------------------------------------
# Runtime environment
#
# SESSION_SECRET (required, ENCRYPTED)
#   AES-GCM key material for session cookie encryption. Set in the
#   Cloudflare Pages dashboard under Settings -> Environment variables ->
#   Production -> tick "Encrypt". Local dev: put in .dev.vars (gitignored).
#   Generate with:
#     node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
#
# AZURE_AD_CLIENT_ID (optional, plaintext)
#   Multi-tenant app registration Client ID used for the Device Code login
#   flow. Only required when you want end users to sign in with their own
#   Azure AD account (no Service Principal). See DEPLOYMENT.md for the app
#   registration checklist.
# ------------------------------------------------------------------
[vars]
# Non-secret vars can go here. AZURE_AD_CLIENT_ID can live here in plaintext
# since Client IDs are public identifiers, or in the dashboard alongside
# the encrypted SESSION_SECRET — either works.
